[package]
name = "xiaobaiyun"
version = "0.1.9"
edition = "2021"
description = "小白云 XiaoBaiYun: a little cloud that floats on your screen and translates whatever you select, Chinese <-> English"
license = "MIT"

[dependencies]
# Pin the versioned winit API used to create the composition window.
# Omit software: a failed GPU renderer must reach our GL retry, not Slint's software fallback.
slint = { version = "=1.18.1", default-features = false, features = [
    "std", "backend-default", "renderer-femtovg", "renderer-femtovg-wgpu",
    "accessibility", "compat-1-2", "system-tray", "raw-window-handle-06", "unstable-winit-030",
] }
raw-window-handle = "0.6"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = true
strip = true
